services:
  dn_bot:
    build: .
    container_name: dn_bot
    env_file:
      - .env
    # Keep stdin open to allow for interactive terminal input
    stdin_open: true
    # Allocate a pseudo-TTY
    tty: true
    environment:
      # Where the halt sentinel is written. Must point at the mounted volume
      # below, or a halt vanishes on the next `docker compose up` and the bot
      # happily resumes trading on top of unhedged exposure.
      ASTER_DN_DATA_DIR: /app/data
    volumes:
      # The whole project, not a hand-maintained file list.
      #
      # This used to name six individual source files, which silently excluded
      # two_leg.py and funding_economics.py: editing either on the host had no
      # effect on a running container, so the bot could run stale
      # execution-safety code while the file on disk looked correct. Every new
      # module hit the same trap. Mounting the directory removes the maintenance
      # step. (Add `:ro` if you want the code immutable at runtime -- nothing on
      # the bot's own path writes into /app, only into /app/data below.)
      - .:/app
      # Writable state, so halt.json survives a container recreate.
      - ./data:/app/data
