[pytest]
# Collect ONLY the offline unit tests.
#
# Several other test_*.py files in this repo are not tests at all -- they are
# manual scripts that build a real AsterApiManager from .env and PLACE REAL
# ORDERS (test_aster_orders.py, test_corrected_orders.py, test_comprehensive_methods.py,
# test_final_corrected.py, test_real_positions.py, test_balance.py,
# test_cancel_order.py, test_account_balance.py). They only survive a bare
# `pytest` today because they are module-level `async def` with no async runner,
# so pytest errors instead of executing them. That is luck, not safety.
#
# Run those deliberately and individually, e.g. `python test_aster_orders.py`.
python_files =
    test_two_leg.py
    test_funding_economics.py
    test_execution_paths.py
    test_strategy_logic.py
    test_api_manager.py
    test_delta_neutral_bot_cli.py

# Fail loudly if a coroutine is left un-awaited: that pattern silently produced
# "passing" tests here before (a sync lambda returning a coroutine from an
# AsyncMock side_effect never runs, so the assertion tested nothing).
filterwarnings =
    error::RuntimeWarning
